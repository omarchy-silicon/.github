name: Feature request
description: Propose scoped engineering work without implying support or release availability.
title: "[feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Omarchy Silicon targets all present and future Apple M-series chips and materially distinct boards. The program is in active development; no board is currently supported or qualified, and no supported installer or release is available.
  - type: textarea
    id: problem
    attributes:
      label: Problem or capability
      description: Describe the user or engineering need without treating an unqualified board or artifact as supported.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Identify affected repositories, exact board/profile boundaries, dependencies, and rollback considerations.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and acceptance criteria
      description: State the reproducible evidence, CI checks, delivery checks, and physical qualification required to accept the work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain existing approaches and why they are insufficient.
